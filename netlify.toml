# Netlify Configuration for GastroGen
# Deploys frontend1 as the production medical dashboard

[build]
  command = "echo 'frontend1 static build ready'"
  publish = "frontend1/frontend"

# Transparent proxy to live Hugging Face ZeroGPU backend
[[redirects]]
  from = "/api/*"
  to = "https://devashri26-gastrogen.hf.space/api/:splat"
  status = 200
  force = true

# Single Page Application navigation fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
