name: Sync GastroGen to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install huggingface_hub
        run: pip install --upgrade huggingface_hub

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN')
          if not token:
              raise ValueError('HF_TOKEN secret is not set in repository secrets.')

          api = HfApi(token=token)
          api.upload_folder(
              folder_path='.',
              repo_id='Devashri26/GastroGen',
              repo_type='space',
              ignore_patterns=['.git/**', '.github/**'],
              commit_message='Sync from GitHub via HfApi'
          )
          print('Successfully synced repository to Hugging Face Space!')
          "
